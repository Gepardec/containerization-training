apiVersion: v1
kind: Namespace
metadata:
  name: k8s-demo
---
apiVersion: v1
kind: Secret
metadata:
  name: hello-config
  namespace: k8s-demo
type: Opaque
stringData:
  WELCOME_MESSAGE: "Hello from Kubernetes"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-web
  namespace: k8s-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-web
  template:
    metadata:
      labels:
        app: hello-web
    spec:
      containers:
        - name: hello-web
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: WELCOME_MESSAGE
              valueFrom:
                secretKeyRef:
                  name: hello-config
                  key: WELCOME_MESSAGE
          command: ["/bin/sh", "-c"]
          args:
            - |
              cat <<EOF >/srv/index.html
              <html>
                <head><title>Kubernetes Demo</title></head>
                <body>
                  <h1>${WELCOME_MESSAGE}</h1>
                  <p>Pod: $(hostname)</p>
                  <p>Namespace: k8s-demo</p>
                </body>
              </html>
              EOF
              python -m http.server 8080 --directory /srv
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: hello-web
  namespace: k8s-demo
spec:
  selector:
    app: hello-web
  ports:
    - name: http
      port: 80
      targetPort: 8080
  type: ClusterIP
